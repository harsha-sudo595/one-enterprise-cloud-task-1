<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Directory</title>

    <link rel="stylesheet" href="../style.css">
  
<link rel="stylesheet" href="../css/employee-directory.css">
</head>

<body>

    <h1>Employee Directory</h1>

 <div class="filters">

    <input
        type="text"
        id="searchInput"
        placeholder="Search by Name or Employee ID"
    >

    <select id="departmentFilter">
        <option value="">All Departments</option>
    </select>

    <select id="designationFilter">
        <option value="">All Designations</option>
    </select>

    <select id="statusFilter">
        <option value="">All Status</option>
    </select>

    <select id="sortSelect">
        <option value="">Sort By</option>
        <option value="name-asc">Name A-Z</option>
        <option value="name-desc">Name Z-A</option>
        <option value="id-asc">Employee ID Ascending</option>
        <option value="id-desc">Employee ID Descending</option>
    </select>

    <button id="resetBtn">Reset Filters</button>

</div>

<div id="employeeContainer" class="employee-container"></div>

    
    <script src="../data/employees.js"></script>
     <script src="../js/employee-directory.js"></script>
    

</body>
</html>
