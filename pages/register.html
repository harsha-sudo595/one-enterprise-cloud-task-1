<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>

    <link rel="stylesheet" href="../css/register.css">
</head>

<body>

    <main class="registration-container">

        <div class="heading">
            <h1>Employee Registration</h1>
            <p>Create a new employee account</p>
        </div>

        <form>

            <div class="form-grid">

                <div class="form-group">
                    <label for="employeeId">Employee ID</label>
                    <input type="text" id="employeeId" placeholder="Enter Employee ID">
                </div>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter Full Name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter Email Address">
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="Enter Mobile Number">
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department">
                        <option value="">Select Department</option>
                        <option>HR</option>
                        <option>CRM</option>
                        <option>Finance</option>
                        <option>Development</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="designation">Designation</label>
                    <input type="text" id="designation" placeholder="Enter Designation">
                </div>

                <div class="form-group">
                    <label for="joiningDate">Date of Joining</label>
                    <input type="date" id="joiningDate">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter Password">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password">
                </div>

                <div class="buttons">
                    <button type="submit" class="register-btn">Register</button>
                    <button type="reset" class="reset-btn">Reset</button>
                </div>

            </div>

        </form>

    </main>
    
<script src="../js/employee-register.js"></script>


</body>
</html>
