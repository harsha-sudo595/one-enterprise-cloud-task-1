<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        .attendance-container {
            padding: 30px;
            overflow-x: auto;
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .attendance-table th,
        .attendance-table td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .attendance-table th {
            background: #f2f2f2;
        }

        .attendance-table select {
            padding: 8px;
        }

        .attendance-table button {
            padding: 8px 12px;
            margin: 3px;
            cursor: pointer;
        }

        .badge {
            padding: 6px 10px;
            border-radius: 15px;
            font-weight: bold;
        }

        .present {
            background: #d4edda;
        }

        .absent {
            background: #f8d7da;
        }

        .half-day {
            background: #fff3cd;
        }

        .wfh {
            background: #d1ecf1;
        }
    </style>
</head>

<body>

    <h1>Employee Attendance</h1>

    <div class="attendance-container">

        <table class="attendance-table">

            <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Employee Name</th>
                    <th>Department</th>
                    <th>Attendance Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="attendanceBody">
            </tbody>

        </table>

    </div>


    <!-- Employee Data -->
    <script src="../data/employees.js"></script>

    
<script>
const attendanceBody = document.getElementById("attendanceBody");

const attendanceData = {};

function renderAttendance() {

    attendanceBody.innerHTML = "";

    employees.forEach(function(employee) {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${employee.id}</td>
            <td>${employee.name}</td>
            <td>${employee.department}</td>

            <td>
                <select id="status-${employee.id}">
                    <option value="">Select Status</option>
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                    <option value="Half Day">Half Day</option>
                    <option value="Work From Home">Work From Home</option>
                </select>

                <span id="badge-${employee.id}"></span>
            </td>

            <td>
                <button onclick="markAttendance(${employee.id})">
                    Mark Attendance
                </button>

                <button onclick="updateAttendance(${employee.id})">
                    Update
                </button>

                <button onclick="resetAttendance(${employee.id})">
                    Reset
                </button>
            </td>
        `;

        attendanceBody.appendChild(row);
    });
}


function markAttendance(id) {

    if (attendanceData[id]) {
        alert("Attendance already marked. Use Update.");
        return;
    }

    const select = document.getElementById("status-" + id);

    if (select.value === "") {
        alert("Please select a status.");
        return;
    }

    attendanceData[id] = select.value;

    showBadge(id);

    alert("Attendance marked successfully.");
}


function updateAttendance(id) {

    const select = document.getElementById("status-" + id);

    if (select.value === "") {
        alert("Please select a status.");
        return;
    }

    attendanceData[id] = select.value;

    showBadge(id);

    alert("Attendance updated successfully.");
}


function resetAttendance(id) {

    delete attendanceData[id];

    document.getElementById("status-" + id).value = "";

    document.getElementById("badge-" + id).innerHTML = "";
}


function showBadge(id) {

    const badge = document.getElementById("badge-" + id);

    badge.innerHTML =
        " <span class='badge'>" +
        attendanceData[id] +
        "</span>";
}


renderAttendance();


      

    </script>

</body>
</html>
