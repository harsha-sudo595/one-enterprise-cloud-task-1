<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Request Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: #f4f6fb;
        }

        h1 {
            text-align: center;
            color: #263f8f;
            margin-bottom: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 13px 28px;
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }

        .apply-btn {
            background: #2878e8;
        }

        .reset-btn {
            background: #d9535f;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #2878e8;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Leave Request Management</h1>

    <div class="container">

        <form id="leaveForm">

            <div class="form-grid">

                <div class="field">
                    <label>Employee ID</label>
                    <input type="text" id="employeeId" placeholder="Enter Employee ID" required>
                </div>

                <div class="field">
                    <label>Employee Name</label>
                    <input type="text" id="employeeName" placeholder="Enter Employee Name" required>
                </div>

                <div class="field">
                    <label>Department</label>
                    <input type="text" id="department" placeholder="Enter Department" required>
                </div>

                <div class="field">
                    <label>Leave Type</label>
                    <select id="leaveType" required>
                        <option value="">Select Leave Type</option>
                        <option value="Casual Leave">Casual Leave</option>
                        <option value="Sick Leave">Sick Leave</option>
                        <option value="Earned Leave">Earned Leave</option>
                        <option value="Maternity Leave">Maternity Leave</option>
                    </select>
                </div>

                <div class="field">
                    <label>From Date</label>
                    <input type="date" id="fromDate" required>
                </div>

                <div class="field">
                    <label>To Date</label>
                    <input type="date" id="toDate" required>
                </div>

                <div class="field full-width">
                    <label>Reason</label>
                    <textarea id="reason" placeholder="Enter Leave Reason" required></textarea>
                </div>

                <div class="field">
                    <label>Total Leave Days</label>
                    <input type="number" id="totalDays" readonly>
                </div>

            </div>

            <div class="buttons">
                <button type="submit" class="apply-btn">
                    Apply Leave
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>
            </div>

        </form>

    </div>

    <a href="../modules/employee-management.html" class="back">
        ← Back to Employee Management
    </a>


    <script>
        const fromDate = document.getElementById("fromDate");
        const toDate = document.getElementById("toDate");
        const totalDays = document.getElementById("totalDays");

        function calculateDays() {

            if (fromDate.value && toDate.value) {

                const start = new Date(fromDate.value);
                const end = new Date(toDate.value);

                const difference =
                    (end - start) / (1000 * 60 * 60 * 24) + 1;

                if (difference > 0) {
                    totalDays.value = difference;
                } else {
                    totalDays.value = "";
                    alert("To Date must be after From Date.");
                }
            }
        }

        fromDate.addEventListener("change", calculateDays);
        toDate.addEventListener("change", calculateDays);


        document.getElementById("leaveForm").addEventListener("submit", function (event) {

            event.preventDefault();

            alert("Leave applied successfully.");

            this.reset();
            totalDays.value = "";
        });
    </script>

</body>

</html>
