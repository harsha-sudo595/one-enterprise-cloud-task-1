<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Request Management</title>

     <link rel="stylesheet" href="../../css/leave.css">
</head>

<body>

    <h1>Leave Request Management</h1>

    <div class="container">

        <form id="leaveForm">

            <div class="form-grid">

                <div class="field">
                    <label>Employee ID</label>
                    <input type="text" id="employeeId" placeholder="Enter Employee ID" required>
                </div>

                <div class="field">
                    <label>Employee Name</label>
                    <input type="text" id="employeeName" placeholder="Enter Employee Name" required>
                </div>

                <div class="field">
                    <label>Department</label>
                    <input type="text" id="department" placeholder="Enter Department" required>
                </div>

                <div class="field">
                    <label>Leave Type</label>
                    <select id="leaveType" required>
                        <option value="">Select Leave Type</option>
                        <option value="Casual Leave">Casual Leave</option>
                        <option value="Sick Leave">Sick Leave</option>
                        <option value="Earned Leave">Earned Leave</option>
                        <option value="Maternity Leave">Maternity Leave</option>
                    </select>
                </div>

                <div class="field">
                    <label>From Date</label>
                    <input type="date" id="fromDate" required>
                </div>

                <div class="field">
                    <label>To Date</label>
                    <input type="date" id="toDate" required>
                </div>

                <div class="field full-width">
                    <label>Reason</label>
                    <textarea id="reason" placeholder="Enter Leave Reason" required></textarea>
                </div>

                <div class="field">
                    <label>Total Leave Days</label>
                    <input type="number" id="totalDays" readonly>
                </div>

            </div>

            <div class="buttons">
                <button type="submit" class="apply-btn">
                    Apply Leave
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>
            </div>

        </form>

    </div>

    <a href="../modules/employee-management.html" class="back">
        ← Back to Employee Management
    </a>

<script src="../data/leave.js"></script>

</body>

</html>
